description: >-
  Rose Rocket publishes a real, named two-tier price list on its pricing page, which
  is more than most enterprise TMS vendors do — one tier even carries a number. But
  it prices the PLATFORM, not the API. There is no API plan, no per-call rate, no
  included call quota and no overage schedule anywhere on the page or in the
  developer docs. The only API line item is a feature bullet on the Enterprise tier
  ("Custom integrations & unlimited API access"), which reads as API access being an
  Enterprise-tier concern rather than something included with the entry plan. Neither
  tier can be bought online: both buttons say "Talk to Sales".
