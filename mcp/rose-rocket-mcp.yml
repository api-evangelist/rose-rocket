description: >-
  Rose Rocket ships NO MCP server. This file is a CANDIDATE tool list derived from
  the published OpenAPI so the shape of an agent surface is on the record; nothing in
  it is offered by the provider and no endpoint below is real. The finding is worth
  stating plainly because Rose Rocket markets AI agents hard — TED, Rosie and Rocky
  are on the pricing page, included on every plan with "no limits on invocations" —
  and every one of them is an in-product agent. There is no way for an agent OUTSIDE
  Rose Rocket to reach the platform except by writing an OAuth 2.0 REST client
  against 19 generic object operations, using credentials that only an account
  representative can issue.
