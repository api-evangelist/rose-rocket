candidate_tools_note: >-
  DERIVED, NOT OFFERED. Each tool below binds to a real operation in the published
  OpenAPI and would inherit that operation's parameters as its inputSchema. The generic
  object model makes this awkward in a way worth recording: a single get_object tool
  covers every entity in the platform, so an agent cannot be told from the schema what
  a "customer" or an "order" actually contains — the domain shape is in prose only
  (see data-model/rose-rocket-data-model.yml).
