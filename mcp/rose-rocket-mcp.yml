blockers_for_a_real_server:
  - No self-serve credentials. An MCP server would need an OAuth client only an account representative can issue.
  - No machine-readable domain schema, so tool inputs cannot be validated beyond {objectKey, json}.
  - No securitySchemes in the OpenAPI, so an MCP generator has no auth declaration to read.
  - Destructive operations (delete, bulk_delete) have no reversal path and no dry-run mode.
