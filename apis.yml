apis:
  - name: Rose Rocket Platform Model API
    description: >-
      The Platform Model API is Rose Rocket's single public REST surface. Rather than a
      resource-per-endpoint design, it exposes 19 operations over a generic object model:
      create, read, update, delete, upsert-by-external-id, bulk delete, search and
      autocomplete against /objects, where the objectKey field in the payload selects the
      domain object (customer, order, task, address, commodity, manifest, partner, quote,
      financial line item, invoice, bill, tag, asset, contact, tax rate, webhook
      destination). It also carries user-group management, board navigation and an event
      surface. Webhook destinations and subscriptions are themselves configured through
      the same /objects endpoint. All requests carry an OAuth 2.0 bearer token.
    humanURL: https://roserocket.readme.io/reference
    baseURL: https://network.roserocket.com/api/v2/platformModel
