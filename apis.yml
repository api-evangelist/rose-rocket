aid: rose-rocket
name: Rose Rocket
description: >-
  Rose Rocket is a Toronto-based transportation management system (TMS) for freight
  brokers, carriers and 3PLs, sold as an AI-native, configurable operations platform
  rather than an off-the-shelf template. The product covers order intake, dispatch,
  tendering, tracking, documents, invoicing and billing, with no-code custom fields,
  boards and workflows, in-product AI agents (TED, Rosie, Rocky) and role-based access
  control down to the widget. Its developer surface is the Platform Model API, a single
  generic object-CRUD REST API served at network.roserocket.com/api/v2/platformModel that
  reads and writes every domain object — customer, order, task, stop, manifest, commodity,
  partner, quote, invoice, bill, asset, tag, contact, document — through one set of
  /objects operations keyed by objectKey, plus user groups, boards, events and webhook
  destinations. Authentication is OAuth 2.0 (authorization code or client-credentials
  service account) against an Auth0-hosted authorization server at a.roserocket.com.
  API access is not self-serve: credentials come from an account representative or the
  partnership team, and the pricing page lists "unlimited API access" as an Enterprise
  tier feature.
