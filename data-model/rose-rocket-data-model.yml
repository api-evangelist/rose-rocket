id_prefixes:
  note: >-
    fullId is a human-readable per-org sequence with a per-object prefix. Only two are
    stated outright in the docs; the rest are visible in samples but not enumerated
    anywhere, so they are NOT guessed here.
  observed:
    - {objectKey: customer, prefix: 'CUST-', example: CUST-9, source: https://roserocket.readme.io/docs/getting-started}
    - {objectKey: order, prefix: 'O-', example: O-19, source: https://roserocket.readme.io/docs/manifest-1}
    - {objectKey: manifest, prefix: 'M-O-', example: M-O-19, note: 'Composed from the order it covers.', source: https://roserocket.readme.io/docs/manifest-1}
gaps:
  - No entity schema is machine-readable. The OpenAPI has no domain models and no $ref graph between them.
  - No endpoint enumerates the valid objectKey values, so a client cannot discover the entity list at runtime.
  - No endpoint enumerates an organization's custom fields, which are a headline product feature.
  - 'Several connected objects are named but have no reference page of their own: Compliance, Lane, AssetType, TariffLane, TariffDimension, TariffConversion, FuelTableBreakpoint.'
