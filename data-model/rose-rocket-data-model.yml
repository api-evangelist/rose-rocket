description: >-
  The entity graph of the Rose Rocket Platform Model API. It could not be derived
  from the OpenAPI: the spec models every record as JSONRecord { id, objectKey } with
  a free-form `json` bag and declares eleven request/response wrappers, no domain
  entities and no $ref links between them. The graph below is read from the object
  reference, where Rose Rocket names each object's key and each relationship as a
  "connected object". This is the single largest machine-readability gap in the
  provider's surface: the relationships are real, documented and stable, and none of
  them are in the contract, so no generated client and no agent can discover them.
access_pattern:
  note: >-
    Every entity is reached through the same operations. There is no per-entity path.
  read: GET /objects/{recordId}  (or GET /objects/{objectKey}/{externalId}/external)
  expand: '?paths=<connected object>,<connected object> — connected objects are omitted by default'
  search: POST /objects/search with {boardId, filters, filtersOperator, orderByPath, orderByDirection, limit}
  write: 'POST /objects | PUT /objects/{recordId} | PATCH /objects (upsert by externalId) | DELETE /objects/{recordId} | POST /objects/bulk_delete'
  selector: The objectKey value in the payload or path selects the entity type.
common_fields:
  note: All records extend a common base, observed identically across every object page and in the Getting Started response sample.
  fields:
    - {name: id, type: string (uuid), description: Globally unique record identifier.}
    - {name: objectKey, type: string, description: The entity type. Determines which schema the record follows.}
    - {name: orgId, type: string (uuid), description: Owning organization. The tenancy boundary.}
    - {name: fullId, type: string, description: 'Human-readable per-org sequence, e.g. CUST-9, O-19, M-O-19.'}
    - {name: externalId, type: string | null, description: Caller-owned identifier. The upsert key. Nullable.}
    - {name: source, type: string, description: 'How the record was created, e.g. "manual".'}
    - {name: status, type: string (enumerated), description: Present on most operational objects.}
    - {name: createdAt, type: string (date-time), description: UTC.}
    - {name: createdBy, type: string (uuid), description: User id.}
    - {name: updatedAt, type: string (date-time), description: UTC.}
    - {name: updatedBy, type: string (uuid), description: User id.}
    - {name: version, type: number, description: Increments on every update. No documented optimistic-concurrency header uses it.}
    - {name: widgets, type: array, description: 'In-product UI extension points on this record: {key, name, version}. See components/rose-rocket-components.yml.'}
    - {name: widgetToOpen, type: object, description: Pointer to the widget the UI should open for this record.}
entities:
  - name: Order
    objectKey: order
    domain: operations
    description: A revenue-generating agreement. The container for the work to be done and its progress.
    docs: https://roserocket.readme.io/docs/order
  - name: Task
    objectKey: task
    domain: operations
    description: A unit of work on an order. Statuses new, incomplete, inprogress, assigned, complete, problem, canceled.
    docs: https://roserocket.readme.io/docs/task
  - name: Stop
    objectKey: stop
    domain: operations
    description: A location at which tasks are performed. Carries pickup and delivery tasks and proof documents.
    docs: https://roserocket.readme.io/docs/stop-2
  - name: Manifest
    objectKey: manifest
    domain: operations
    description: 'A dispatched grouping of tasks. Auto-named from the order it covers, e.g. M-O-19.'
    docs: https://roserocket.readme.io/docs/manifest-1
  - name: Commodity
    objectKey: commodity
    domain: operations
    description: 'The freight itself. Carries the industry classification fields: nmfc, freightClass, hazmatClass, unNumber, packingGroupNumber.'
    docs: https://roserocket.readme.io/docs/commodities
  - name: Customer
    objectKey: customer
    domain: crm
    description: 'The party being billed. customerType is one of Shipper, Broker, Receiver, Other.'
    docs: https://roserocket.readme.io/docs/customer
  - name: Partner
    objectKey: partner
    domain: crm
    description: The carrier or vendor side. Holds compliance identifiers (MCDID, DOT), lanes and asset types.
    docs: https://roserocket.readme.io/docs/partners
  - name: Contact
    objectKey: contact
    domain: crm
    description: A person at a customer or partner. Explicitly NOT shared across modules — a contact belongs to one parent.
    docs: https://roserocket.readme.io/docs/contacts
  - name: Address
    objectKey: address
    domain: reference
    description: A location. Carries a Google Place ID alongside the postal fields.
    docs: https://roserocket.readme.io/docs/address
  - name: Quote
    objectKey: quote
    domain: financial
    description: Priced offer. Acts as revenue (sell) or cost (buy) depending on which side of the order it sits.
    docs: https://roserocket.readme.io/docs/quotes
  - name: FinancialLineItem
    objectKey: financialLineItem
    domain: financial
    description: The money atom. Every financial object stores its amounts as connected financial line items.
    docs: https://roserocket.readme.io/docs/financial-line-items
  - name: Invoice
    objectKey: invoice
    domain: financial
    description: Customer-facing billing document. subTotal is READ-ONLY, derived from its line items.
    docs: https://roserocket.readme.io/docs/invoices
  - name: Bill
    objectKey: bill
    domain: financial
    description: Partner-facing cost document. Verifies and tracks what is owed to a carrier.
    docs: https://roserocket.readme.io/docs/bills
  - name: PayStub
    objectKey: payStub
    domain: financial
    description: Driver pay document.
    docs: https://roserocket.readme.io/docs/pay-stubs
  - name: TaxRate
    objectKey: taxRate
    domain: financial
    description: Applied to financial line items. Requires at least one connected tax rate component to function.
    docs: https://roserocket.readme.io/docs/tax-rate-and-tax-rate-components
  - name: TaxRateComponent
    objectKey: taxRateComponent
    domain: financial
    description: The parts a tax rate is composed of.
    docs: https://roserocket.readme.io/docs/tax-rate-and-tax-rate-components
  - name: TaxRule
    objectKey: taxRule
    domain: financial
    description: Decides which tax rate applies to which line items.
    docs: https://roserocket.readme.io/docs/tax-rule
  - name: GLAccount
    objectKey: glAccount
    domain: financial
    description: General-ledger account a financial line item posts to.
    docs: https://roserocket.readme.io/docs/gl-account
  - name: FuelIndex
    objectKey: fuelIndex
    domain: rating
    description: Regional fuel prices. Grouped by FuelIndexGroup and consumed by FuelTable breakpoints.
    docs: https://roserocket.readme.io/docs/fuel-zones-and-tariffs
  - name: Tariff
    objectKey: tariff
    domain: rating
    description: Rating structure with dimensions, conversions, lanes and a status.
    docs: https://roserocket.readme.io/docs/fuel-zones-and-tariffs
  - name: Asset
    objectKey: asset
    domain: fleet
    description: Truck or trailer. Carries plate number, compliance records and an assigned user.
    docs: https://roserocket.readme.io/docs/assets
  - name: Document
    objectKey: document
    domain: shared
    description: Generated or uploaded file attached to almost any object (POD, POP, invoice PDF).
    docs: https://roserocket.readme.io/docs/documents
  - name: Tag
    objectKey: tag
    domain: shared
    description: Free labels attached across objects.
    docs: https://roserocket.readme.io/docs/tags
  - name: User
    objectKey: user
    domain: identity
    description: Person or service account in the org. Referenced as CSR, account manager, commissionee, driver.
    docs: https://roserocket.readme.io/docs/roles-and-permissions
  - name: UserGroup
    objectKey: userGroup
    domain: identity
    description: 'The one entity with dedicated, typed operations in the OpenAPI: list, create, search, list members, add/remove members.'
    docs: https://roserocket.readme.io/reference/listusergroups
  - name: Board
    objectKey: board
    domain: platform
    description: A saved view. Also a permission boundary — boardId is accepted on most read and write operations and changes what is visible.
    docs: https://roserocket.readme.io/docs/using-boards-in-rose-rocket
  - name: Event
    objectKey: event
    domain: platform
    description: 'Activity on a record. Types: create, mutate, internal, widget-open, widget-close. The only paginated collection in the API.'
    docs: https://roserocket.readme.io/reference/get_events
  - name: WebhookDestination
    objectKey: webhookDestination
    domain: platform
    description: A subscriber URL. Created through POST /objects like any other record.
    docs: https://roserocket.readme.io/docs/webhooks-2
  - name: WebhookSubscription
    objectKey: webhookSubscription
    domain: platform
    description: Binds a destination to an eventName.
    docs: https://roserocket.readme.io/docs/webhooks-2
