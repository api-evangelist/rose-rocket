source: >-
  The Rose Rocket object reference pages, each fetched 2026-08-26 as markdown (HTTP
  200) via the .md rendering the provider's own llms.txt advertises:
  /docs/order, /docs/customer, /docs/task, /docs/stop-2, /docs/manifest-1,
  /docs/commodities, /docs/partners, /docs/quotes, /docs/invoices, /docs/bills,
  /docs/financial-line-items, /docs/contacts, /docs/address, /docs/assets,
  /docs/tags, /docs/documents, /docs/document, /docs/pay-stubs, /docs/tax-rule,
  /docs/tax-rate-and-tax-rate-components, /docs/gl-account,
  /docs/fuel-zones-and-tariffs, /docs/object-descriptions-and-operations — all under
