description: >-
  Rose Rocket publishes an operational status page and a versioned API path, and
  nothing else about lifecycle. There is no versioning policy, no deprecation policy,
  no Sunset or Deprecation header commitment, no published SLA, no end-of-life notice
  channel and no dated API changelog — the developer hub's changelog holds two posts,
  both from the day it launched in January 2025. A v1 surface still appears in the
  provider's own current authentication example alongside v2, with no statement about
  whether v1 is supported, frozen or scheduled for removal. An integrator has no
  published way to learn that something is going away.
