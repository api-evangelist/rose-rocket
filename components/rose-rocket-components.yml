description: >-
  Rose Rocket ships a client-side component layer distinct from its API client:
  "Zinnia", the Rose Rocket design system, plus a widget toolkit for building
  the in-platform widgets that appear on an object's data panel. These are
  npm-distributed React/web libraries, not hosted embeds — there is no
  script-tag/CDN surface and no hosted iframe component documented. The
  in-product concept they attach to (widgets on an object record, boards and
  data-panel views) is documented in the Object Builder and Boards guides; the
  libraries themselves carry no published README or API reference, so this
  artifact records the distribution facts and the platform concept, not an
  invented component inventory.
docs:
  - https://roserocket.readme.io/docs/object-builder
  - https://roserocket.readme.io/docs/using-boards-in-rose-rocket
libraries:
