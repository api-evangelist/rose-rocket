  - {name: '@roserocket-sdk/zinnia-particles', version: 1.4.0, published: '2026-07-22', purpose: Building blocks of Rose Rocket's design system (framework-agnostic layer).}
  - {name: '@roserocket-sdk/zinnia-particles-react-web', version: 0.0.15, published: '2026-07-22', purpose: React Web bindings for the design-system particles.}
  - {name: '@roserocket-sdk/zinnia-atoms-react-web', version: 0.0.15, published: '2026-07-22', purpose: Atoms in the Rose Rocket design system (React Web).}
  - {name: '@roserocket-sdk/zinnia-primitives-react-web', version: 0.0.4, published: '2025-09-30', purpose: Utilities for building components in the design system.}
  - {name: '@roserocket-sdk/configurables', version: 0.0.2, published: '2025-12-15', purpose: Rose Rocket configurables.}
families:
  design_system:
    name: Zinnia
    description: >-
      Rose Rocket's design system, published as a particles/atoms/primitives
      layering with a framework-agnostic core and React Web bindings. Versions
      are pre-1.0 for every React package, which is the provider's own signal
      about stability.
    packages: ['@roserocket-sdk/zinnia-particles', '@roserocket-sdk/zinnia-particles-react-web', '@roserocket-sdk/zinnia-atoms-react-web', '@roserocket-sdk/zinnia-primitives-react-web']
  widgets:
    name: Widget toolkit
    description: >-
      Widgets are the extension point on a Rose Rocket object record: an object
      response carries a `widgets[]` array (each entry has key, name, version)
      and a `widgetToOpen` pointer, observed verbatim in the create-customer
      response sample in the Getting Started guide. @roserocket-sdk/widget-toolkit
      is the library for building them.
    packages: ['@roserocket-sdk/widget-toolkit']
    evidence: https://roserocket.readme.io/docs/getting-started
