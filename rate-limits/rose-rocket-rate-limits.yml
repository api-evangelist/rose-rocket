description: >-
  Rose Rocket publishes NO rate limits for the Platform Model API. This is a genuine
  zero, not an unchecked one: no limits page exists, no quota or throttle is
  mentioned on any of the eight documentation pages, no 429 response is declared on
  any of the 19 operations in the spec, and no rate-limit header appears anywhere in
  the contract or the docs. The nearest thing to a statement is the Enterprise tier
  feature bullet "unlimited API access" on the pricing page, which is a commercial
  entitlement rather than a runtime limit. An agent integrating here has no published
  budget to plan against and no runtime signal to back off on — it will discover any
  throttle only by being throttled, and cannot distinguish that from a 500.
