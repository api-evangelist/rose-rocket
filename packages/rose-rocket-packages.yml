description: >-
  Rose Rocket ships a first-party npm scope, @roserocket-sdk, that covers three
  distinct things: an API client (api-client, client-types-generator), an
  external developer CLI (rock-cli, rock-cli-core — catalogued in
  cli/rose-rocket-cli.yml), and the Zinnia design system + widget toolkit used to
  build in-platform widgets (catalogued in components/rose-rocket-components.yml).
  There is NO Rose Rocket package on PyPI, RubyGems, Packagist, crates.io,
  NuGet, Maven Central or pkg.go.dev — every probe returned 404/empty. The
  monorepo the packages point at, github.com/RoseRocketSDK/roserocket-sdk, is
  NOT public: the org shows 0 public repositories, so the source is closed even
  though the artifacts are published.
